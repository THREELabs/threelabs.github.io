<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="theme-color" content="#ffffff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Dreamstate Highway</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏎️</text></svg>">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      overscroll-behavior: none;
      -webkit-touch-callout: none;
    }
    #startup-white {
      position: fixed;
      inset: 0;
      z-index: 2147483647;
      background: #fff;
      opacity: 1;
      pointer-events: auto;
      will-change: opacity;
    }
    body.startup-revealing #hud-root,
    body.startup-revealing #instructions-overlay {
      visibility: hidden !important;
    }
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      touch-action: none;
    }
    #instructions-overlay {
      position: fixed;
      bottom: 24px;
      left: 28px;
      background: rgba(14, 18, 24, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      padding: 10px 16px;
      color: #b8c8d8;
      font-family: 'Segoe UI', sans-serif;
      font-size: 12px;
      pointer-events: none;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      z-index: 10;
      opacity: 0;
      transition: opacity 0.8s ease;
    }
    #instructions-overlay.hud-visible {
      opacity: 1;
    }
    #instructions-overlay span {
      color: #ffd152;
      font-weight: 700;
    }
    @media (max-width: 920px), (hover: none), (pointer: coarse) {
      #instructions-overlay {
        display: none !important;
      }
    }
    body.has-touch-controls #instructions-overlay {
      display: none !important;
    }
  </style>
  <script type="module" crossorigin src="./assets/index-8trhYJO8.js"></script>
</head>
<body class="startup-revealing">
  <div id="startup-white" aria-hidden="true"></div>
  <div id="canvas-container"></div>
  
  <div id="instructions-overlay">
    <span>[TAB / T]</span> Tablet & Apps &nbsp;|&nbsp; 
    <span>[W / ↑]</span> Gas &nbsp;|&nbsp; 
    <span>[S / ↓]</span> Brake &nbsp;|&nbsp;
